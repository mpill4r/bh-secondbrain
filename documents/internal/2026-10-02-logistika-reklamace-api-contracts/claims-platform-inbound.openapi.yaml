# Platform Inbound API (Axapta → Platform) — the endpoint OUR platform exposes and
# Axapta calls after closing a claim case. Counterpart to the outbound
# libs/axapta_client/contract/axapta-integration.openapi.yaml.

openapi: 3.1.0
info:
  title: Claims – Platform Inbound API (Axapta → Platform)
  version: 0.4.0
  summary: Contract for the endpoint exposed by our Platform, called by Axapta.
  description: |
    # Purpose
    This contract is the **opposite direction** to the `Axapta Integration API – Claims`.
    It describes the endpoint that our **Platform** exposes and that **Axapta calls**.

    # Principle
    The Platform no longer **polls** Axapta for the claim case status. Instead,
    Axapta calls this endpoint after **closing the case**, telling the Platform to
    **start processing a specific claim case** (typically generating a return document
    for the supplier and an email draft).

    The notification carries the case identification and the **supplier** — name,
    e-mail and address. The Platform prints the supplier on the return note and sends
    the note to that e-mail. The rest (case detail, Návratka) is still fetched from
    Axapta via `GET /claim-cases/{axaptaRef}` and
    `GET /claim-cases/{axaptaRef}/protocol`.

    # Endpoints within this contract

    | # | Method | Endpoint                            | Direction        | Purpose                       |
    |---|--------|-------------------------------------|------------------|-------------------------------|
    | 1 | POST   | `/claim-cases/{axaptaRef}/process`  | Axapta→Platform  | Trigger claim case processing |

    # Architectural conventions (consistent with the counterpart contract)
    1. **REST + JSON**, not SOAP.
    2. **Idempotency**: `Idempotency-Key` header (UUID from Axapta). Same key → the
       Platform will not process the case twice, it returns the same response.
    3. **Authentication via a static token** (`Authorization: Bearer <token>`), issued
       by the **Platform** to the Axapta team. Internal network, HTTPS.
    4. **Errors in RFC 9457** (`application/problem+json`).
    5. **Processing is synchronous** — the endpoint returns the URL only after the
       delivery note is rendered and stored.

    # Changelog

    ## [v0.4.0] — delivery-note URL in the processing response
    - **`TriggerAck`: replaced `axapta_ref` with `document_link`** (`uri`). Axapta now
      receives the stored document's direct Azure Blob URL and does not reconstruct it
      from an opaque case identifier.

security:
  - bearerToken: []

tags:
  - name: axapta-inbound
    description: Endpoint exposed by the Platform, called by Axapta.

paths:
  /claim-cases/{axaptaRef}/process:
    parameters:
      - $ref: '#/components/parameters/AxaptaRef'
    post:
      tags: [axapta-inbound]
      summary: Trigger claim case processing on the Platform
      description: |
        Axapta calls this after **closing a claim case**, signalling the Platform to
        start processing the case `axaptaRef`. The notification carries the
        identification and the supplier; the case detail and the return document are
        fetched from Axapta (`GET /claim-cases/{axaptaRef}`,
        `GET /claim-cases/{axaptaRef}/protocol`).

        **Idempotency**: a repeated call with the same `Idempotency-Key` will not trigger
        processing again — it returns the same response.
      operationId: triggerClaimCaseProcessing
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: |
          The `axaptaRef` in the path identifies the case; the body carries the supplier
          the return note is addressed to.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClaimCaseTrigger'}
      responses:
        '201':
          description: Delivery note rendered and stored.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TriggerAck'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: |
        Static token issued by the **Platform** to the Axapta team, sent in every request
        as `Authorization: Bearer <token>`. Internal network, no OAuth/OIDC.

  parameters:
    AxaptaRef:
      name: axaptaRef
      in: path
      required: true
      schema: {type: string}
      description: |
        **Unique ID of the claim case** generated by Axapta. The same key as in the
        counterpart contract; the Platform knows it from the create response.
      example: "CASE-2026-0009123"

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUID from Axapta. Same key → the Platform will not process the case again, it
        returns the same response.
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

  schemas:
    ClaimCaseTrigger:
      type: object
      required: [supplier]
      description: |
        Notification from Axapta: case identification, event type and the supplier the
        return note is addressed to. The remaining business data (case detail, Návratka)
        the Platform fetches from Axapta itself.
      properties:
        event:
          type: string
          enum: [claim_case_closed]
          default: claim_case_closed
          description: |
            Event type. For now only: `claim_case_closed` — case closed, start processing.
        delivery_note_number:
          type: string
          nullable: true
          description: |
            Delivery note number (optional, for readability). The key is `axaptaRef` in
            the path, not this field.
        case_number:
          type: string
          nullable: true
          description: Human-readable case number (e.g. `RD00057484`), if available.
        occurred_at:
          type: string
          format: date-time
          description: When the event occurred in Axapta (UTC).
        supplier:
          $ref: '#/components/schemas/Supplier'

    Supplier:
      type: object
      required: [name, email, address]
      description: |
        Supplier the claim case is against. The Platform prints `name` and `address` on
        the return note and e-mails the note to `email`. Same shape as `Supplier` in the
        counterpart contract, trimmed to the fields the Platform needs.
      properties:
        name:
          type: string
          example: "Supplier s.r.o."
        email:
          type: string
          format: email
          description: Address the return note is e-mailed to.
          example: "reklamace@supplier.cz"
        address:
          $ref: '#/components/schemas/Address'

    Address:
      type: object
      required: [line1, city, postal_code]
      description: |
        Postal address of the supplier, printed on the return note. Same shape as
        `Address` in the counterpart contract; the three fields needed for a printable
        Czech address are required.
      properties:
        line1: {type: string, example: "Ulice 12/34"}
        line2: {type: string}
        city: {type: string, example: "Město 5"}
        postal_code: {type: string, example: "190 00"}
        country: {type: string, example: "CZ"}

    TriggerAck:
      type: object
      required: [received, document_link]
      properties:
        received:
          type: boolean
          example: true
        document_link:
          type: string
          format: uri
          description: Direct Azure Blob URL of the rendered delivery note.

    Problem:
      description: RFC 9457 Problem Details
      type: object
      properties:
        type: {type: string, format: uri, default: "about:blank"}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
