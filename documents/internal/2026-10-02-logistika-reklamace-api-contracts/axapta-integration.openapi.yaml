openapi: 3.1.0
info:
  title: Axapta Integration API
  version: 0.9.10
  summary: Contract for the endpoints MS Dynamics AX (Axapta) must expose for the ViaPharma platform
  description: |
    # Purpose
    This document describes the **subset of Axapta endpoints the ViaPharma
    platform needs**, across two use cases that share the same Axapta API
    (same base URL, bearer auth, RFC 9457 errors, `Idempotency-Key`, cursor
    pagination, `string` identifiers):

    - **Claims (Reklamace)** — supplier/product master-data lookups and claim-case
      sync. Tags `claims-*`.
    - **Transport invoicing (Fakturace doprav)** — route ("trasa") document
      verification and billing readiness. Tags `transport-routes-*`.

    The two use cases are independent at the endpoint level; the sections below
    and the `x-tagGroups` split keep it explicit which endpoint belongs to which.

    # Integration principle

    Communication is bidirectional but clearly split:

    - **Axapta = source of truth for master data**: suppliers, products, planned
      transport routes. It exposes **read endpoints** that our application calls
      (pull).
    - **The platform pushes results back**: claim cases, and verified transport
      route documents.

    # Endpoints — Claims (Reklamace)

    | # | Method | Endpoint                                  | Direction | Purpose                                                     |
    |---|--------|-------------------------------------------|-----------|-------------------------------------------------------------|
    | 1 | GET    | `/suppliers`                              | Read      | Search suppliers (fulltext, IČO, DIČ)                       |
    | 2 | GET    | `/suppliers/{id}`                         | Read      | Supplier detail                                             |
    | 3 | POST   | `/products/lookup`                        | Read      | Product lookup + field parsing (incl. quantity and price from label/code) |
    | 4 | POST   | `/claim-cases`                            | Write     | Upsert a claim case — AX dedups by delivery note (201 created / 200 appended) |
    | 5 | GET    | `/claim-cases/{axaptaRef}`                | Read      | State of an existing case (ad-hoc fetch)                    |
    | 6 | POST   | `/goods-receipt-reservations`             | Write     | Receipt with reservation — MS number (delivery/DL) + photo links |
    | 7 | GET    | `/claim-cases/{axaptaRef}/protocol`       | Read      | Download the official claim protocol (PDF / link) after closure |

    # Endpoints — Transport invoicing (Fakturace doprav) — Fáze 1

    A route instance ("trasa", one day) is keyed by the **AR number**
    (e.g. `AR1548240`), generated by Axapta and printed as a barcode on every
    document type — the single pairing key.

    | # | Method | Endpoint                              | Direction | Purpose                                                       |
    |---|--------|---------------------------------------|-----------|---------------------------------------------------------------|
    | 1 | GET    | `/transport-routes/{ar}`              | Read      | Read one route: expected documents, warehouse, carrier, planned driver/SPZ, planned departure/return, expected km + tolerance, expected stamps, status |
    | 2 | GET    | `/transport-routes`                   | Read      | List/reconcile routes (`?date=` or `?date_from=&date_to=`, `&status=&cursor=&limit=`) |
    | 3 | POST   | `/transport-routes/{ar}/documents`    | Write     | Upsert recognized documents + ZOPV data + verdict (status + reason) + notes (per document / route-wide). Idempotent, versioned. |

    The km-tolerance check and the `MANUAL_REVIEW → READY_FOR_BILLING` override
    happen **inside Axapta**, not via this API. GPS Dozor (Fáze 2) is a separate
    third-party API and is **not** part of this contract.

    # MS label vs SP label — terminology (Claims)

    - **MS label** = identifier of **one delivery** from a supplier = **one
      delivery note** with X items (delivery-level). Photographed in *Step 0 —
      receipt with reservation*, when damage is already visible on hand-over from
      the carrier. OCR reads the **MS number**. Sent through
      **`POST /goods-receipt-reservations`** as a "receipt with reservation"
      record (MS number + damage photo links).
    - **SP label** = internal per-item label (item-level) applied at intake. Its
      content is read by OCR and validated through **`POST /products/lookup`**
      (`sp_label`). **The SP label is NOT attached as a photo** — only its
      content is sent as data. The lookup returns the item + parsed fields (batch,
      expiry, item number, item name, unit count, supplier name, delivery note
      number).

    # Identification via the SP label + linking in Axapta

    - **Item identification** in a claim is carried by the **SP label** (the real
      per-item identifier the warehouse needs). `product_id` denotes only the SKU,
      not a concrete physical unit. A concrete unit is pinned by the **serial**
      (unique per package, GS1 AI 21) or by the full scanned **`gs1_2d`**. Two
      damaged items = two claim lines (e.g. SP00001, SP00002).
    - **Linking the claim to the receipt-with-reservation is owned by Axapta.**
      The Platform sends **no** linking handle: it cannot know which internal
      reservation handle to return (the lookup does not expose it, the delivery
      note is not unique, and `axapta_ref` does not yet exist at that point).
      Axapta links by **`supplier_id` + `delivery_note_number`** (= `ms_number`).
    - **For warehouse claims** there is no live receipt, but the **batch
      provenance** (batch / serial / gs1_2d) unambiguously points back to the
      original goods receipt → from it Axapta derives **supplier, delivery note
      and price** (one batch = one supplier / DN / price, no ambiguity). Without
      provenance the supplier / DN cannot be derived → the claim is not created
      (no guessing, no fallback to the product's primary supplier, no confirmation
      in the PWA).

    # Architectural requirements for the Axapta team

    1. **REST + JSON**, not SOAP.
    2. **Idempotency for POST endpoints**: `Idempotency-Key` header (client-side
       UUID). Same key + same body → identical response, no duplicate case or
       item. Critical on flaky warehouse networks.
    3. **Authentication via a static token** (`Authorization: Bearer <token>`).
       The integration runs on the **internal network**; OAuth/Entra ID is not
       used. The Axapta team issues the token; it is sent on every request in the
       header. HTTPS even inside the network and token rotation per agreement are
       recommended.
    4. **Errors as RFC 9457 Problem Details** (`application/problem+json`). No
       textual error strings, no HTTP 200 with `{"success": false}`.
    5. **Response-time SLA** for lookup endpoints: p95 ≤ 500 ms. Called from the
       PWA during real-time photographing.
    6. **Pagination for list endpoints**: cursor-based (`?cursor=...&limit=...`).
       Invalid cursor → `400 Bad Request`.
    7. **The Axapta ID = `axapta_ref`** in our systems. A string is enough; we
       never parse it.

    # Conventions
    - Dates: ISO 8601 (`date-time` in UTC, `date` for calendar dates).
    - Identifiers: strings. Our app does not assume UUIDs on the Axapta side.

    # Changelog

    ## [v0.9.10] — unknown MS labels return 404
    - **`POST /goods-receipt-reservations`: unknown MS label → `404 Not Found`.**
      Matches `POST /products/lookup`

    ## [v0.9.9] — temperature-log document type (transport spec gap #7, §5.3.6)
    - **`TransportDocumentType`: added `TEMPERATURE_LOG`** — temperature logs are filed
      "formou linků, ekvivalentně ostatním dokumentům", so they need no new mechanism,
      only their own enum value; without it a scanned log would have to be mis-filed as
      another type. Stamps are not checked, as for `ZOPV`.
    - **The temperature-chain verdict is deliberately NOT added.** The spec expects one
      (dodržen / nedodržen / nedodané podklady) but does not say whether it belongs on
      the document or on the route verdict, and it is a Fáze 2–4 write. Recorded as a
      named open point under "Out of scope" instead of guessing a shape that would be
      expensive to change once Boomi has built against it.

    ## [v0.9.8] — GPS-measured km on the ZOPV (transport spec gap #6, §5.3.6)
    - **`ZopvData`: added `gps_distance_km`** (`number`, nullable) next to the declared
      `distance_km` — Fáze 2 compares what the driver wrote on the ZOPV against what GPS
      Dozor measured, and the submission had nowhere to carry the second number. The
      comparison itself runs **in Axapta**, like the existing `km_tolerance` check.
    - **Out-of-scope note amended.** It listed GPS km among the deferred Fáze 2–4 Axapta
      writes, which now contradicted the schema. Only the GPS *integration* is deferred;
      the nullable *field* ships now, because adding it later costs a contract revision
      and Boomi rework while it costs nothing inert.

    ## [v0.9.7] — planned route times (transport spec gap #5, §5.2)
    - **`TransportRoute`: added `planned_departure` / `planned_return`** (`date-time`,
      nullable) — Fáze 2 needs a time window to query GPS Dozor for the vehicle, and the
      route carried only `date`; a whole calendar day is too coarse, it would match the
      vehicle's other routes that day. Axapta already holds both times as planned data.
    - **Fáze 1 is unaffected** — nothing in the kiosk flow reads them, so they can ship
      with the rest of the contract rather than needing a later revision.

    ## [v0.9.6] — date-range filter on the route list (transport spec gap #4, edge case B3)
    - **`GET /transport-routes`: added `date_from` / `date_to`** (inclusive, either side
      may be omitted for an open-ended range) — reconciliation is a period job: the
      month-end deadline sweep and the second avízo ask which routes in the *month* are
      still missing documents, which `date` (a single calendar day) could only answer by
      issuing ~30 calls.
    - **`date` kept as the single-day shorthand**, declared **mutually exclusive** with
      the range so Axapta never has to guess which wins.
    - **Added `400 Bad Request`** to the endpoint — it previously documented only
      `200`/`401` even though the cursor description already promised a `400`. Now it
      also covers `date` + range together and an inverted range.

    ## [v0.9.5] — carrier contact (transport spec gap #3, §4.3.7 + edge case D2)
    - **`Carrier`: added `primary_contact`** (reuses the existing `Contact` schema,
      nullable) — the Platform e-mails ~15 carriers (receipt confirmation, second avízo
      for documents missing at month end) and carrier identity comes from Axapta per
      edge case D2, but `Carrier` carried only `code` / `name`, so there was no address
      to send to. Named and shaped like `Supplier.primary_contact` rather than a bare
      `email` string, so one contact convention covers both use cases.

    ## [v0.9.4] — per-document driver note (transport spec gap #2, §4.3.7)
    - **`SubmittedTransportDocument`: added `note`** — the spec has the driver commenting
      on the *scanned documents*, so a note belongs to the document it is about. Only a
      submission-level note existed, which could not say *which* document was wrong.
    - **`TransportRouteSubmissionCreate.note` kept, scope narrowed to route-wide** —
      not dropped: the web app already sends it, and a remark about the hand-over as a
      whole has no single document to hang on. The two fields are independent and both
      may be sent.

    ## [v0.9.3] — route home warehouse (transport spec gap #1, edge case A5 from the spec)
    - **`TransportRoute`: added `warehouse`** (new schema `Warehouse`, open-ended
      `code` + `name` like `Carrier`) — the route's home distribution centre
      (`PAVLOV` / `BRNO` / `OSTRAVA`). Without it the Platform cannot detect spec
      edge case **A5** (documents handed in at the wrong warehouse): the kiosk knows
      which warehouse it stands in but had nothing on the route to compare against.
      Also the key for Fáze 2 geofencing, whose coordinates stay Platform-side.

    ## [v0.9.2] — OPL code-sign on `Product`
    - **`Product`: OPL / controlled-substance sentinel documented** — for items in an
      OPL group (omamné a psychotropní látky) Axapta must not disclose master data and
      returns `id = "OPL"`, `name = "Manual"` with the remaining fields empty. Documented
      on the schema, not enforced by it: no shape change, so the typed client and every
      existing response stay valid. Consumers must route such an item to **manual
      handling** and never auto-process it.

    ## [v0.9.1] — gaps found against the swimlane flows
    - **`ClaimItemAxapta`: added `product_name`** — GET-case responses show the item
      product name alongside `product_id`; the response item now carries it (there is no
      `GET /products/{id}`, and document generation can happen days after the lookup).
    - **`GoodsReceiptReservation`: added `supplier`** — the nightly avízo (advance notice)
      is addressed to the delivery's supplier, but the reservation only carried
      `ms_number`. Axapta resolves MS → delivery → supplier and returns it, so the Platform
      can address the avízo without a second call.
    - **`POST /transport-routes/{ar}/documents`: added `409 Conflict`** — submitting
      documents to an already-billed/closed route is rejected (spec edge case A3: "zápis se
      neprovede").
    - **`ClaimItemAxapta` made response-tolerant** — it is now a standalone schema
      (only `item_ref` required) instead of `allOf ClaimItemCreate`. The terse create-echo
      in the swimlanes omits `problem_type`/`quantity` on items, which the inherited
      `required` would have rejected. `ClaimItemCreate` (the request) is unchanged.

    ## [v0.9] — second use case: Transport invoicing (Fakturace doprav), Fáze 1
    - **Document now covers two use cases** sharing one Axapta API. Renamed from
      `axapta-reklamace.openapi.yaml` to `axapta-integration.openapi.yaml` and
      retitled `Axapta Integration API`.
    - **Use-case-prefixed tags** + `x-tagGroups`: claims operations grouped under
      `claims-*` / "Reklamace (Claims)"; transport operations under
      `transport-routes-*` / "Fakturace doprav (Transport invoicing)".
    - **New endpoints (transport invoicing):** `GET /transport-routes/{ar}`,
      `GET /transport-routes`, `POST /transport-routes/{ar}/documents`.
    - **New schemas** (`Transport*`, `Carrier`, `ZopvData`): route read model,
      expected vs submitted documents, and the verification submission. New enums
      `TransportDocumentType`, `TransportRouteStatus`.
    - **Scope = Fáze 1 only.** GPS Dozor (Fáze 2, third-party API) and Fáze 2–4
      Axapta writes (GPS km, temperature chain) are explicitly out of this contract.
      (GPS km was later given a nullable slot — see v0.9.8.)

    ## [v0.8] — warehouse claims, SP-label identification, linking owned by Axapta, English contract
    - **Path `/products:lookup` → `/products/lookup`.** The colon broke routing in
      ASP.NET (the consumer had to replace it before calling). The endpoint is now
      directly callable. All references updated accordingly.
    - **`ClaimItemCreate`: SP-label identification + warehouse provenance.** Added
      `sp_label`, `gs1_2d`, `serial`; `product_id` is now optional. Rule: **at
      least one of `sp_label` / `product_id` / `gs1_2d`** must be present; a
      concrete warehouse unit = `product_id` + one of (`batch`+`expiry_date` /
      `serial` / `gs1_2d`). `location` is descriptive only (where the item lies),
      not a provenance key. Per-item lines handle multiplicity (two problems = two
      items).
    - **`ClaimCaseCreate`: linking simplified.** `reservation_ref` removed —
      `delivery_note_number` (with `supplier_id`) is the **single linking + dedup
      key**. For warehouse claims the supplier / DN / price come from the **item
      batch provenance**; without provenance the claim is not created. The Platform
      sends nothing for linking.
    - **`GoodsReceiptReservation`: linking done by Axapta.** `reservation_ref` is
      an internal Axapta handle the Platform never sends back; `ms_number` is
      explicitly **non-unique** (one DN = one MS = N reservations); `claim_case_ref`
      is filled by Axapta by matching `supplier_id` + `delivery_note_number`, in
      either direction.
    - **`ClaimCaseAxapta`: `case_number` is nullable** and out of `required` — the
      human case number is created only later (at closure / after pricing) and may
      be `null` at create time. `axapta_ref` is the unique case ID returned
      immediately on create and the key used to address the case in paths
      (`{axaptaRef}`).
    - **`GET /claim-cases/{axaptaRef}`: no periodic polling.** Closure is signalled
      by Axapta calling our Platform Inbound API; this GET is an ad-hoc fetch of
      the current state (e.g. to read `case_number` after closure).
    - **`ProductLookupItem.parsed_2d`: also filled for the location variant**, with
      `quantity` carrying the real count on the location (still `null` for a bare
      EAN/2D scan, which the user enters in the PWA).
    - **Whole contract translated to English** version bumped to 0.8.0.

    ## [v0.7] — create-vs-append decided by Axapta (upsert), no more 409 orchestration
    - **`POST /claim-cases` is an upsert** — Axapta checks whether an open case for
      the delivery (`delivery_note_number`) already exists. If **yes**, it appends
      the items and returns `200 OK`; if **no**, it creates a new case and returns
      `201 Created`. Both return `axapta_ref` (+ `case_number` when available).
    - **409-based orchestration on our side removed.** Our app no longer branches
      on create-vs-append; it always posts `POST /claim-cases` and Axapta decides.
      Response `409` and schema `ClaimCaseConflict` removed.
    - **Dedup key = `delivery_note_number`.** `external_ref` stays as our reference
      identifier but is **no longer a dedup key**. Repeated-call idempotency is
      still handled by the `Idempotency-Key` header.
    - **`POST /claim-cases/{axaptaRef}/items` removed.** With the upsert it was
      redundant — further items are added by another `POST /claim-cases` with the
      same `delivery_note_number`.

    ## [v0.4] — price in lookup, response unified to an array, protocol
    - **`/products/lookup` response: only `products[]`.** Previously the response
      returned both a single `product` and `products[]` — confusing. Unified to
      **always `products[]`** (`ProductLookupItem`); parsed fields (`parsed_2d` /
      `parsed_sp_label`) moved onto the item.
    - **`/products/lookup`: added `price`** (+ optional `currency`) on the item —
      to **identify/verify a concrete product** (delivery note + product + batch is
      not enough because the batch is not mandatory).
    - **New endpoint `GET /claim-cases/{axaptaRef}/protocol`** — after closure
      Axapta generates the official **claim protocol (PDF)**; our Platform
      downloads it (PDF or link) and attaches it to the supplier e-mail.

    ## [v0.2] — product-lookup review for warehouse claims
    - **`/products/lookup` request**: added **location** (`location`, "pallet
      number" in the process doc) — required for warehouse claims.
    - **`/products/lookup` response**: added **supplier** (`supplier`, name + ID)
      and **delivery note number** (`delivery_note_number`, an ID/number, NOT a
      file reference).
    - **`/products/lookup` location variant**: input = just `location`, response
      returns the **listing of everything on that location** (`products[]`).
    - **Claim case / item**: added **photo links** (`photo_links`) and **location**
      at item level (`ClaimItemCreate.location`).

    ## Out of scope (Axapta → Platform)
    - Events "all items accepted by QA → generate documents", delivery-list
      generation, saving to the shared disk and the draft e-mail via Graph API are
      our Platform's responsibility — they are not Axapta read/write endpoints, so
      they are not here. If Axapta should send a callback/event it will be added
      separately (webhook contract).
    - **Inbound closure trigger:** Axapta signals case closure by calling our
      Platform Inbound API (`POST .../process`); the Platform does not poll.
    - **Exception — claim protocol:** the official PDF protocol is generated by
      **Axapta** (print report) after closure; our Platform only **downloads** it
      via `GET /claim-cases/{axaptaRef}/protocol`. Therefore it is an Axapta read
      endpoint and must be in this contract.

    ## Out of scope — Transport invoicing
    - **GPS Dozor (Fáze 2)** is a separate third-party read-only API
      (`a1.gpsguard.eu`, Basic auth) for actual km and temperature logs — not
      Axapta, so it is not in this contract. If contracted later it gets its own
      file.
    - **Temperature-chain verdict — open point.** The document type
      `TEMPERATURE_LOG` exists (v0.9.9), so the log itself can be scanned, linked and
      submitted like any other document. What is **not** agreed is where the *verdict*
      (dodržen / nedodržen / nedodané podklady) lives: a field on the submitted
      document, or an input to the route verdict. Deliberately left out rather than
      guessed — the wrong shape here is more expensive to undo than to add.
    - **Fáze 2–4 Axapta writes** (temperature-chain status, DHL settlement) are
      deferred per the spec (§8: "API kontrakt řešeno samostatně"). They will attach to
      `TransportRouteSubmissionCreate` / `TransportRoute` when contracted.
      **Exception — GPS km:** `ZopvData.gps_distance_km` is already in the contract
      (v0.9.8). The *field* is cheap and inert now (always `null` in Fáze 1), whereas
      adding it later would mean a contract revision and Boomi rework; only the GPS
      *integration* is deferred, not the slot to report it in.
    - **Email confirmations to drivers/carriers** are the Platform's
      responsibility (the kiosk does not print), not an Axapta endpoint.

security:
  - bearerToken: []

tags:
  # --- Claims (Reklamace) ---
  - name: claims-master-data
    description: Claims — read endpoints for master data (suppliers, products), called by our app for lookups.
  - name: claims-write
    description: Claims — write endpoints; our application pushes created / updated claims.
  - name: claims-goods-receipt
    description: Claims — goods receipt; "receipt with reservation" record on visible damage.
  # --- Transport invoicing (Fakturace doprav) ---
  - name: transport-routes-read
    description: Transport invoicing — read a planned route (expected documents, carrier, planned driver/SPZ, km tolerance) or list routes.
  - name: transport-routes-write
    description: Transport invoicing — submit recognized route documents + ZOPV data + verdict; close the route.

x-tagGroups:
  - name: Reklamace (Claims)
    tags: [claims-master-data, claims-write, claims-goods-receipt]
  - name: Fakturace doprav (Transport invoicing)
    tags: [transport-routes-read, transport-routes-write]

paths:
  # ===========================================================================
  # READ — master data (called by our app)
  # ===========================================================================

  /suppliers:
    get:
      tags: [claims-master-data]
      summary: Search suppliers
      description: |
        Called by our AI agent when identifying the supplier from a delivery-note
        photo (typically by IČO or name). Also called by the PWA for type-ahead.
      operationId: searchSuppliers
      parameters:
        - in: query
          name: q
          schema: {type: string}
          description: Fulltext (name, IČO, DIČ).
        - in: query
          name: ico
          schema: {type: string, pattern: '^[0-9]{8}$'}
        - in: query
          name: dic
          schema: {type: string}
        - in: query
          name: cursor
          schema: {type: string}
          description: Opaque cursor from the previous page. Invalid cursor → `400 Bad Request`.
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SupplierList'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /suppliers/{supplierId}:
    parameters:
      - $ref: '#/components/parameters/SupplierId'
    get:
      tags: [claims-master-data]
      summary: Supplier detail
      operationId: getSupplier
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Supplier'}
        '404': {$ref: '#/components/responses/NotFound'}

  /products/lookup:
    post:
      tags: [claims-master-data]
      summary: Identify a product + parse label/code fields (incl. unit count)
      description: |
        Called in two main scenarios:

        1. **Intake claims** — the AI agent extracts the **SP label** (internal
           label applied at intake) from a photo and sends its content in
           `sp_label`. Axapta parses it and returns `parsed_sp_label.quantity` —
           the **unit count from the label**. Our app stores it in the intake
           session.
        2. **Warehouse claims** — the PWA scans a 2D code, an EAN, or enters
           EAN + batch + expiry. **The unit count is not returned by Axapta in any
           of these variants** — the user enters it manually in the PWA — except
           for the **location variant**, which returns the real per-item count.

        ## Supported product-identification variants

        Our app always sends **exactly one** of these **five** variants:

        | # | Input                                  | Field                                           | Quantity in response?          |
        |---|----------------------------------------|-------------------------------------------------|--------------------------------|
        | 1 | SP label (AI-extracted from a photo)   | `sp_label`                                      | **Yes** (required)             |
        | 2 | 2D code (GS1 DataMatrix)               | `gs1_2d`                                        | No (entered by the user in PWA)|
        | 3 | EAN + batch + expiry                   | `ean` + `batch` + `expiry_date`                 | No (entered by the user in PWA)|
        | 4 | Bare EAN                               | `ean`                                           | No (entered by the user in PWA)|
        | 5 | Location only (pallet number)          | `location`                                      | **Yes**, per item (multiple in `products[]`) |

        ## Response = always `products[]`

        The response always returns the array `products[]` (`ProductLookupItem`).
        For variants 1–4 it is an array **of one element** (the identified
        product); for variant 5 (location) of several elements.

        ## Location variant — lookup by location (warehouse claims)

        For warehouse claims we need to know **everything that lies on a given
        location (pallet)**. The input is just `location` (pallet number); Axapta
        returns multiple items in `products[]`. One item's payload is effectively
        the same as a single-product lookup (product + supplier + delivery note +
        price + batch + expiry), so this is an overload of this endpoint, not a new
        endpoint. The per-item `quantity` is carried in the parsed fields
        (`parsed_2d.quantity` / `parsed_sp_label.quantity`).

        ## Location on variants 1–4

        `location` (pallet number) may also accompany variants 1–4 to pin a
        concrete pallet on a warehouse claim; product identification is driven by
        the primary input (`sp_label` / `gs1_2d` / `ean`).

        ## Where quantity ends up

        This is a **stateless lookup endpoint** — Axapta keeps no context between
        the lookup and a later `POST /claim-cases`. Our app stores the quantity and
        sends it back in `ClaimItemCreate.quantity` when creating the item.

        ## What Axapta returns

        Always `products[]` (`ProductLookupItem`), where each item carries:

        - The identified `Product` (master data: name, primary supplier).
        - `supplier` (supplier name + ID) and `delivery_note_number` (an ID/number,
          **not** a file reference).
        - `price` (+ optional `currency`) — to verify the concrete product, because
          the batch is not mandatory. We don't use the currency.
        - If the input was `gs1_2d` / `sp_label`, or for the location variant, the
          parsed fields (`parsed_2d` / `parsed_sp_label`) — batch, expiry, serial,
          quantity.

        ## Controlled substances (OPL)

        For items in an OPL group Axapta withholds the master data and returns the
        sentinel `product.id = "OPL"` / `product.name = "Manual"` (see `Product`).
        Such an item must be routed to **manual handling outside the application** —
        it is never auto-processed and its `id` must not be sent back as
        `ClaimItemCreate.product_id`.
      operationId: lookupProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductLookupRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductLookupResponse'}
        '400':
          description: |
            Invalid input combination (e.g. `batch` without `ean`, or none of the
            five variants).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '404': {$ref: '#/components/responses/NotFound'}

  # ===========================================================================
  # WRITE — claim sync (called by our app)
  # ===========================================================================

  /claim-cases:
    post:
      tags: [claims-write]
      summary: Upsert a claim case in Axapta
      description: |
        Called by our app on claim submit. The endpoint is an **upsert** — our app
        always posts `POST /claim-cases` and **Axapta itself decides on the
        background** whether an open case for this delivery already exists:
        - **none** → Axapta creates a new record and returns `201 Created`,
        - **exists** → Axapta appends the items to the existing case and returns
          `200 OK`.

        In both cases it returns its internal `axapta_ref`. `case_number` (the
        human number, e.g. `RD00057484`) may be `null` at create time — it is
        created later, at closure / after pricing.

        **Dedup key = `delivery_note_number`** (with `supplier_id`). Axapta decides
        create-vs-append by it; our app no longer branches on `409`. If
        `delivery_note_number` is missing, Axapta always creates a new case.
        `external_ref` is only our reference identifier, **not** a dedup key.

        **Idempotency**: a repeated call with the same `Idempotency-Key` must not
        create a duplicate — it returns the same response.

        **Photos**: claim photos live on the shared disk; only their URLs are sent
        to Axapta in `photo_links` (at case and item level).

        **Linking to a receipt with reservation**: linking is done by **Axapta**,
        by matching `supplier_id` + `delivery_note_number` (= `ms_number`). The
        Platform sends no linking handle. For warehouse claims the supplier and DN
        are resolved from the item batch provenance (returned by the lookup).
      operationId: createClaimCaseInAxapta
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClaimCaseCreate'}
      responses:
        '201':
          description: |
            A new case was created (no open case existed for this delivery).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClaimCaseAxapta'}
        '200':
          description: |
            An open case already existed for this delivery — Axapta appended the
            items from the request body and returns its current state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClaimCaseAxapta'}

  /claim-cases/{axaptaRef}:
    parameters:
      - $ref: '#/components/parameters/AxaptaRef'
    get:
      tags: [claims-write]
      summary: State of an existing case in Axapta
      description: |
        Called by our app to fetch the details of an existing case — for example
        after Axapta signals closure via the Platform Inbound API, to read
        `case_number` and the final state. This is an ad-hoc state query, not
        periodic polling (closure is pushed by Axapta, the Platform does not poll).
      operationId: getClaimCaseFromAxapta
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClaimCaseAxapta'}
        '404': {$ref: '#/components/responses/NotFound'}

  /claim-cases/{axaptaRef}/protocol:
    parameters:
      - $ref: '#/components/parameters/AxaptaRef'
    get:
      tags: [claims-write]
      summary: Download the official claim protocol (PDF / link)
      description: |
        After a claim case is **closed**, Axapta generates the official **claim
        protocol** (PDF) as a print report. Our Platform downloads it through this
        endpoint and attaches it to the supplier e-mail.

        The endpoint can return either form — driven by the `Accept` header:
        - `Accept: application/json` (default) → metadata + a **link** to the PDF
          (`ClaimProtocol.protocol_url`, stored on the shared disk like other
          documents). Recommended — consistent with "only URLs go to/from Axapta".
        - `Accept: application/pdf` → the **PDF binary** directly (if the Platform
          wants the content in one step, without a second hop to the shared disk).

        The protocol exists only after generation (typically after closure). Until
        Axapta has it, it returns `404 Not Found` (`type` distinguishes "case does
        not exist" from "protocol not generated yet").
      operationId: getClaimProtocol
      parameters:
        - in: header
          name: Accept
          required: false
          schema:
            type: string
            enum: [application/json, application/pdf]
            default: application/json
      responses:
        '200':
          description: |
            OK. Depending on `Accept`, either metadata with a link
            (`application/json`) or the PDF binary (`application/pdf`).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClaimProtocol'}
            application/pdf:
              schema: {type: string, format: binary}
        '404':
          description: |
            The case does not exist, or the protocol has not been generated yet
            (the case is not closed). Distinguished via `type` in Problem Details.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}

  # ===========================================================================
  # WRITE — receipt with reservation (called by our app)
  # ===========================================================================

  /goods-receipt-reservations:
    post:
      tags: [claims-goods-receipt]
      summary: Receipt with reservation — MS number + damage photo links
      description: |
        Called by our Platform in *Step 0* of the intake flow, when damage is
        already visible on hand-over from the carrier (damaged box, cracked
        pallet).

        We send the **MS number** (delivery identifier = one delivery note with X
        items, read by OCR from the **MS label**) and **photo links** to the
        visible damage stored on the shared disk. The photos themselves are not
        sent to Axapta.

        Axapta creates a "receipt with reservation" record and returns its
        `reservation_ref` (an internal handle the Platform never sends back) plus the
        resolved `supplier` (from MS → delivery → supplier) so the Platform can address
        the nightly avízo. When a claim later arises via the SP label, Axapta links the
        reservation to the case by matching `supplier_id` + `delivery_note_number`
        (= `ms_number`) and fills `claim_case_ref`. If an SP label never appears (nothing
        damaged inside), the record stays standalone with `claim_case_ref = null`.

        If Axapta cannot find the supplied MS label, it returns `404 Not Found` with
        RFC 9457 Problem Details, matching `POST /products/lookup`. It never returns
        a successful reservation payload with an empty `supplier` object.

        **Idempotency**: a repeated call with the same `Idempotency-Key` does not
        create a duplicate.
      operationId: createGoodsReceiptReservation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoodsReceiptReservationCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GoodsReceiptReservation'}
        '400':
          description: Invalid input (e.g. missing `ms_number` or `photo_links`).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '404': {$ref: '#/components/responses/NotFound'}

  # ===========================================================================
  # TRANSPORT INVOICING (Fakturace doprav) — Fáze 1
  # ===========================================================================

  /transport-routes:
    get:
      tags: [transport-routes-read]
      summary: List / reconcile transport routes
      description: |
        Lists route instances ("trasy") for reconciliation — e.g. at month end the
        Platform reviews which routes are still `OPEN` (documents not yet delivered)
        or in `MANUAL_REVIEW`. Cursor-paginated.

        The day-to-day flow does not need this: the kiosk pairs a scan to a route by
        the AR barcode and reads it directly via `GET /transport-routes/{ar}`.
      operationId: searchTransportRoutes
      parameters:
        - in: query
          name: date
          schema: {type: string, format: date}
          description: |
            Filter by a single route date (calendar day). 
        - in: query
          name: date_from
          schema: {type: string, format: date}
          description: Start of an **inclusive** open-ended route-date range. 
        - in: query
          name: date_to
          schema: {type: string, format: date}
          description: |
            End of an **inclusive** open-ended route-date range.
        - in: query
          name: status
          schema: {$ref: '#/components/schemas/TransportRouteStatus'}
          description: Filter by route status.
        - in: query
          name: cursor
          schema: {type: string}
          description: Opaque cursor from the previous page. Invalid cursor → `400 Bad Request`.
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransportRouteList'}
        '400':
          description: |
            Invalid query — `date` combined with `date_from` / `date_to`, `date_to`
            earlier than `date_from`, or an invalid cursor.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /transport-routes/{ar}:
    parameters:
      - $ref: '#/components/parameters/Ar'
    get:
      tags: [transport-routes-read]
      summary: Read one transport route (planned + expected documents + state)
      description: |
        Called by the kiosk after it reads the **AR barcode** from a scanned
        document and pairs the scan to a route. Returns what Axapta planned/issued
        for the route, so the Platform can verify completeness:

        - `warehouse` — the route's home DC, compared against the kiosk's own
          warehouse to catch edge case (wrong-warehouse hand-in),
        - `carrier` (DHL / Cedex / own / …), `planned_driver`, `planned_spz`,
        - `planned_departure` + `planned_return` — the planned time window,
        - `expected_km` + `km_tolerance`,
        - `expected_documents[]` — each with `expected_count` and `expected_stamps`
          (the stamp count Axapta expects, e.g. the delivery list = number of
          pharmacy sections; `null` where stamps are not checked, e.g. ZOPV),
        - current `status` and any `submitted_documents[]` already written.

        Stateless read; no polling — the Platform writes the verdict back via
        `POST /transport-routes/{ar}/documents` and reads final state ad-hoc.
      operationId: getTransportRoute
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransportRoute'}
        '404': {$ref: '#/components/responses/NotFound'}

  /transport-routes/{ar}/documents:
    parameters:
      - $ref: '#/components/parameters/Ar'
    post:
      tags: [transport-routes-write]
      summary: Submit recognized route documents + verdict (upsert, versioned)
      description: |
        Called once the kiosk has recognized and paired the scanned documents for a
        route. The route already exists in Axapta (from planning) — this is an
        **upsert of the verification result against it**, not a create.

        The body carries:
        - `documents[]` — every recognized document with its shared-disk
          `storage_link`, `recognized_stamps` and a `version`; for the **ZOPV** the
          parsed `zopv` block (actual driver, SPZ, date, declared `distance_km` and —
          from Fáze 2 on — the GPS-measured `gps_distance_km`),
        - `status` — the Platform's verdict from documents + stamps
          (`READY_FOR_BILLING` or `MANUAL_REVIEW`), plus `status_reason` when
          `MANUAL_REVIEW`,
        - optional route-wide driver notes, propagated into Axapta.

        **Versioning**: a re-submitted document with identical content is ignored;
        changed content is stored as a **new version** (the older version is kept,
        never overwritten). This also covers incremental / multi-day scanning.

        **Idempotency**: a repeated call with the same `Idempotency-Key` does not
        duplicate documents — it returns the same result.

        **Km & override stay in Axapta**: the Platform passes the declared
        `distance_km` (per ZOPV) and, from Fáze 2, the GPS-measured
        `gps_distance_km`; Axapta runs the km-tolerance check and the
        declared-vs-GPS comparison and may move the route to
        `MANUAL_REVIEW` regardless of the submitted `status`. The
        `MANUAL_REVIEW → READY_FOR_BILLING` override is done by the transport worker
        in Axapta, not via this API. The response reflects Axapta's authoritative
        state.

        A route already in `BILLED` state rejects further documents with `409 Conflict`
        (spec edge case A3 — the route is already invoiced and closed).
      operationId: submitTransportDocuments
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransportRouteSubmissionCreate'}
      responses:
        '200':
          description: |
            Documents recorded against the route; returns the route's current
            (Axapta-authoritative) state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransportRoute'}
        '400':
          description: |
            Invalid input (e.g. empty `documents`, or `MANUAL_REVIEW` without
            `status_reason`).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

# =============================================================================
# Components
# =============================================================================

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: |
        Static token issued by the Axapta team, sent on every request as
        `Authorization: Bearer <token>`. Internal network, no OAuth/OIDC.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-side UUID. Same key + same body → same response. Axapta keeps a
        key→result map for at least 24 h.
      schema:
        type: string
        format: uuid
    SupplierId:
      name: supplierId
      in: path
      required: true
      schema: {type: string}
      description: Supplier identifier in Axapta.
    AxaptaRef:
      name: axaptaRef
      in: path
      required: true
      schema: {type: string}
      description: Claim-case identifier in Axapta.
    Ar:
      name: ar
      in: path
      required: true
      schema: {type: string}
      description: |
        Transport route ("trasa") identifier = the AR document number Axapta
        generates and prints as a barcode on every document of the route.
      example: "AR1548240"

  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Resource does not exist
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: |
        The request conflicts with the resource's current state (e.g. submitting
        documents to an already-billed/closed transport route).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

  schemas:
    # =========================================================================
    # Shared (both use cases)
    # =========================================================================
    Problem:
      description: RFC 9457 Problem Details
      type: object
      properties:
        type: {type: string, format: uri, default: about:blank}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        errors:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              message: {type: string}

    PageInfo:
      type: object
      required: [has_more]
      properties:
        next_cursor: {type: [string, "null"]}
        has_more: {type: boolean}

    Address:
      type: object
      properties:
        line1: {type: string}
        line2: {type: string}
        city: {type: string}
        postal_code: {type: string}
        country: {type: string}

    Contact:
      type: object
      properties:
        name: {type: string}
        email: {type: string, format: email}
        phone: {type: string}

    # =========================================================================
    # Claims (Reklamace)
    # =========================================================================
    # ----- Suppliers -----
    Supplier:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string, example: "ViaPharma s.r.o."}
        ico: {type: string, example: "14888742"}
        dic: {type: string, example: "CZ699006246"}
        address: {$ref: '#/components/schemas/Address'}
        primary_contact: {$ref: '#/components/schemas/Contact'}

    SupplierList:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Supplier'}
        page: {$ref: '#/components/schemas/PageInfo'}

    # ----- Products -----
    ProductLookupRequest:
      type: object
      description: |
        Our app always sends **exactly one** of the five product-identification
        variants (see the endpoint description). For variants 1 and 2 the input is
        a raw string — Axapta parses it and, besides the product master data,
        returns the fields parsed from the code/label, **including the claimed
        unit count** if it is encoded.

        Valid combinations:
        - `sp_label`
        - `gs1_2d`
        - `ean` + `batch` + `expiry_date`
        - `ean` alone
        - `location` alone  # location variant — listing of products on a location
      properties:
        sp_label:
          type: string
          description: |
            SP-label content — the internal label ViaPharma applies to goods at
            intake. The AI agent extracts the raw text from a photo and sends it
            here; Axapta parses it (it knows the internal format) and returns the
            identified product + `parsed_sp_label`, which includes the **unit
            count**.
        gs1_2d:
          type: string
          description: |
            Full GS1 2D string (DataMatrix with AI 01/17/10/21). Our app passes it
            raw from the scan; Axapta parses it and returns `parsed_2d`.
        ean:
          type: string
          description: |
            EAN / GTIN, typically 13 digits. Usable alone or combined with
            `batch` + `expiry_date` for more precise identification of a concrete
            batch.
        batch:
          type: string
          description: |
            Batch. Use only together with `ean` (variant 3). Without `ean` or
            without `expiry_date` Axapta returns `400 Bad Request`.
        expiry_date:
          type: string
          format: date
          description: |
            Expiry date. Use only together with `ean` + `batch` (variant 3).
        location:
          type: string
          description: |
            Warehouse location = **pallet number** (referenced as "pallet number"
            in the process doc). Needed for **warehouse claims**.

            - As the **only** input (location variant) → Axapta returns
              `products[]`, the listing of everything on the location.
            - Combined with variant 1–4 → pins a concrete pallet; identification
              is driven by the primary input.
          example: "PAL-0099231"
      minProperties: 1

    ProductLookupResponse:
      type: object
      description: |
        The response always returns `products[]` (`ProductLookupItem`). For
        variants 1–4 it is an array of one element (the identified product); for
        the location variant of several elements (the location listing).
      required: [products]
      properties:
        products:
          type: array
          description: |
            Identified items. Variants 1–4 → 1 element; the location variant →
            0..N elements. An empty array = nothing found (alternatively `404`,
            at Axapta's discretion).
          items: {$ref: '#/components/schemas/ProductLookupItem'}

    ParsedSpLabel:
      type: object
      description: |
        If the input was `sp_label`, Axapta returns the parsed fields including the
        unit count (the SP label always carries `quantity`).

        Fields the PWA shows the foreman for visual verification (Step 2). For
        variants 1–4 the item is `products[0]` (the array has one element):
        1. batch → `batch`
        2. expiry → `expiry_date`
        3. item number → `products[0].product.id`
        4. item name → `products[0].product.name`
        5. unit count → `quantity` (here)
        6. supplier name → `products[0].supplier.name`
        7. delivery note number → `products[0].delivery_note_number`
        8. price → `products[0].price` (for verification, batch optional)
      required: [quantity]
      properties:
        batch: {type: string}
        expiry_date: {type: string, format: date}
        internal_code: {type: string}
        supplier_id:
          type: string
          description: "Supplier ID parsed from the SP label."
        supplier_name:
          type: string
          description: "Supplier name parsed from the SP label."
        delivery_note_number:
          type: string
          description: |
            Delivery note number from the SP label (an ID/number, not a file).
        quantity:
          type: integer
          minimum: 1
          description: |
            Claimed unit count parsed from the SP label. Our app stores it in the
            intake session and sends it back on `POST /claim-cases` as
            `ClaimItemCreate.quantity`.

    ProductLookupItem:
      type: object
      description: |
        One identified lookup item. Unifies the former single-product payload
        (variants 1–4) and the location-listing payload (location variant).
        Carries the product + supplier + delivery note + price + batch/expiry and,
        depending on the input, the parsed fields `parsed_2d` / `parsed_sp_label`.
      required: [product]
      properties:
        product: {$ref: '#/components/schemas/Product'}
        supplier:
          anyOf:
            - {$ref: '#/components/schemas/Supplier'}
            - {type: "null"}
        delivery_note_number:
          type: [string, "null"]
          description: |
            Delivery note number = **an ID/number of the delivery**, NOT a file
            reference. Deliberate decision — we don't want the file (the delivery
            note PDF).
          example: "DL-2026-004812"
        price:
          type: [number, "null"]
          description: |
            Item price — used to **identify/verify the concrete product**. Reason:
            delivery note + product + batch is not enough because the **batch is
            not mandatory**. (`currency` is optional — we don't use it.)
          example: 1249.50
        currency:
          type: [string, "null"]
          description: |
            Price currency (optional). Our app does **not** use it — the price only
            verifies the product. Axapta may fill it for completeness.
          example: "CZK"
        batch: {type: [string, "null"]}
        expiry_date: {type: [string, "null"], format: date}
        location:
          type: [string, "null"]
          description: |
            Pallet number the item lies on. For the location variant it echoes the
            input; for variants 1–4 it is filled if `location` was supplied.
        parsed_2d:
          type: [object, "null"]
          description: |
            Filled when the input was `gs1_2d`, AND per item in the location-variant
            response.
          properties:
            batch: {type: string}
            expiry_date: {type: string, format: date}
            serial: {type: string}
            quantity:
              type: [integer, "null"]
              minimum: 1
              description: |
                Real count on the location (location variant); `null` for a bare
                EAN/2D scan (then the user enters it in the PWA and sends it on
                `POST /claim-cases`).
        parsed_sp_label:
          anyOf:
            - {$ref: '#/components/schemas/ParsedSpLabel'}
            - {type: "null"}
          description: Filled when the input was `sp_label`.

    Product:
      type: object
      description: |
        Product master data.

        ## OPL / addictive-product code-sign (AX-7178)

        Axapta manages controlled substances ("OPL" — omamné a psychotropní látky)
        under a legally restricted regime that **must not be processed automatically**
        by the end system. When the item belongs to an OPL group (its addiction type
        is anything other than *none*), Axapta does **not** disclose the real master
        data. Instead it returns a fixed sentinel ("code-sign") in the two required
        fields:

        - `id` = `"OPL"`
        - `name` = `"Manual"`

        All other fields (`sukl`, `ean`, `primary_supplier_id`, `unit_of_measure`)
        are intentionally left empty and stay valid — only `id` and `name` are
        required, so the sentinel object passes schema validation. A consumer that
        sees `id="OPL"` / `name="Manual"` MUST route the product to manual handling
        and MUST NOT auto-process it.
      required: [id, name]
      properties:
        id:
          type: string
          description: |
            Item id. Set to the sentinel `"OPL"` for controlled-substance products
            (see the OPL code-sign note above); otherwise the real Axapta item id.
        name:
          type: string
          example: "PENTASA Sachet 2g por.gra.pro.60x2g"
          description: |
            Item name. Set to the sentinel `"Manual"` for controlled-substance
            products (OPL code-sign); otherwise the real product name.
        sukl: {type: string}
        ean: {type: string}
        primary_supplier_id: {type: string}
        unit_of_measure: {type: string}

    # ----- Claim case sync -----
    ClaimCaseCreate:
      type: object
      required: [supplier_id, source, problem_type]
      properties:
        supplier_id: {type: string}
        source:
          type: string
          enum: [intake_damaged, intake_undelivered, warehouse, pharmacy, eshop, manual]
          description: |
            For reporting in Axapta. For **warehouse** claims the item provenance
            (batch / serial / gs1_2d) is the single source of supplier,
            `delivery_note_number` and price. No fallback to the product's primary
            supplier; no confirmation in the PWA. Without provenance the supplier /
            DN cannot be derived → the claim is not created (no guessing).
        invoice_number: {type: [string, "null"]}
        problem_type:
          type: string
          enum: [damaged_supplier, damaged_transport, short_expiry, undelivered, wrong_item, quality_defect, other]
        notes: {type: string}
        external_ref:
          type: string
          description: |
            Case ID in our application — a reference identifier for lookup on our
            side. **Not a dedup key** (create-vs-append is decided by Axapta from
            `delivery_note_number`).
        delivery_note_number:
          type: [string, "null"]
          description: |
            Delivery note number (= reservation `ms_number`). The **single dedup +
            linking key** (with `supplier_id`):
            - **dedup for create-vs-append** — Axapta decides by it whether to
              create a new case or append items to an existing one. Without it
              Axapta always creates a new case.
            - **linking to a receipt with reservation** — Axapta matches the
              reservation by `supplier_id` + `delivery_note_number`.
            For warehouse claims it is resolved from the item batch provenance
            (returned by the lookup) — same behaviour as intake. Also fills
            `ClaimCaseAxapta.delivery_note_number`.
        photo_links:
          type: array
          items: {type: string, format: uri}
          description: |
            Links to claim photos stored on the shared disk (URLs). The photos
            themselves are not sent to Axapta — only their links. Case-level photos;
            item-specific photos are on the item.
        items:
          type: array
          description: |
            Optionally the first item(s) can be pushed together with the case.
            Further items are added by another `POST /claim-cases` with the same
            `delivery_note_number` — Axapta appends them to the existing case
            (`200 OK`).
          items: {$ref: '#/components/schemas/ClaimItemCreate'}

    ClaimItemCreate:
      type: object
      description: |
        Identify the product by at least one of `sp_label` / `product_id` /
        `gs1_2d`. A concrete unit (warehouse) = `product_id` + one of
        (`batch`+`expiry_date` / `serial` / `gs1_2d`).
      required: [quantity, problem_type]
      properties:
        sp_label:
          type: [string, "null"]
          description: |
            SP-label content — the per-item identifier for intake claims. Two
            damaged items = two lines (SP00001, SP00002).
        product_id:
          type: [string, "null"]
          description: |
            Optional — at least one of `sp_label` / `product_id` / `gs1_2d` must be
            present. Denotes the SKU, not a concrete physical unit.
        gs1_2d:
          type: [string, "null"]
          description: Raw GS1 DataMatrix scan (GTIN + expiry + batch + serial).
        serial:
          type: [string, "null"]
          description: |
            Unique pack serial (GS1 AI 21) — identifies one concrete package (not
            just the batch). Carried inside `gs1_2d`; standalone for convenience.
        batch: {type: string}
        expiry_date: {type: string, format: date}
        location:
          type: string
          description: |
            Warehouse location / pallet — descriptive only (where the item lies).
            NOT a provenance key.
          example: "PAL-0099231"
        quantity:
          type: integer
          minimum: 1
          description: |
            Claimed unit count. Our app holds it in the intake session. Source:
            - **Intake claims (SP label)**: `parsed_sp_label.quantity` from a prior
              `POST /products/lookup`.
            - **Warehouse claims (2D / EAN)**: manual entry in the PWA — Axapta does
              not return quantity on those lookup variants (the location variant
              does).
        problem_type:
          type: string
          enum: [damaged_supplier, damaged_transport, short_expiry, undelivered, wrong_item, quality_defect, other]
        reason_text: {type: string}
        photo_links:
          type: array
          items: {type: string, format: uri}
          description: |
            Links to photos of the claimed goods stored on the shared disk (URLs).
            Only links go to Axapta, not binaries. The SP label is NOT attached as
            a photo — only its content goes as data in the lookup.

    ClaimCaseAxapta:
      type: object
      required: [axapta_ref, status, created_at]
      properties:
        axapta_ref:
          type: string
          description: |
            Unique case ID generated by Axapta, returned immediately on create. The
            key used to address the case in paths (`{axaptaRef}`).
        case_number:
          type: [string, "null"]
          description: |
            Human case number, e.g. `RD00057484` (or a return number such as
            `Vratka c. 18 888`). Created only later (at closure / after pricing);
            at create time it may be `null`.
        status:
          type: string
          enum: [OPEN, SENT_TO_SUPPLIER, RESOLVED_CREDIT, RESOLVED_REPLACEMENT, REJECTED, CANCELLED]
        supplier_id: {type: string}
        delivery_note_number:
          type: [string, "null"]
          description: |
            The case's delivery note number — the key for linking a "receipt with
            reservation" record (`ms_number`) and for deduplication.
        items:
          type: array
          items: {$ref: '#/components/schemas/ClaimItemAxapta'}
        photo_links:
          type: array
          items: {type: string, format: uri}
          description: "Links to case photos on the shared disk."
        credit_note_number:
          type: [string, "null"]
          description: Filled after `RESOLVED_CREDIT`.
        external_ref: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    ClaimItemAxapta:
      type: object
      description: |
        A claim item as Axapta echoes/returns it. Standalone (not `allOf ClaimItemCreate`)
        on purpose: only `item_ref` is guaranteed. The create echo (`201`) may be terse
        (e.g. `sp_label` + `quantity` + `item_ref`), while the full GET-case response adds
        `product_name`, `problem_type`, `reason_text`, etc. Field semantics are the same as
        on `ClaimItemCreate`. Response-only fields stay optional so a valid Axapta response
        is never rejected.
      required: [item_ref]
      properties:
        item_ref: {type: string}
        product_id: {type: [string, "null"]}
        product_name:
          type: [string, "null"]
          description: |
            Product name resolved by Axapta (e.g. "IBALGIN 400 100x"). Returned on
            GET-case responses so the Platform can build the delivery list / supplier
            e-mail without re-doing the lookup (there is no `GET /products/{id}`, and
            closure may happen days later). May be `null` on the create echo.
          example: "IBALGIN 400 100x"
        sp_label: {type: [string, "null"]}
        gs1_2d: {type: [string, "null"]}
        serial: {type: [string, "null"]}
        batch: {type: [string, "null"]}
        expiry_date: {type: [string, "null"], format: date}
        location: {type: [string, "null"]}
        quantity:
          type: [integer, "null"]
          minimum: 1
          description: Claimed unit count (always present in practice; optional for response tolerance).
        problem_type:
          type: [string, "null"]
          enum: [damaged_supplier, damaged_transport, short_expiry, undelivered, wrong_item, quality_defect, other, null]
          description: Present on the full GET-case response; may be omitted on the terse create echo.
        reason_text: {type: [string, "null"]}
        photo_links:
          type: array
          items: {type: string, format: uri}

    ClaimProtocol:
      type: object
      description: |
        Metadata of the official claim protocol generated by Axapta (print report)
        after closure. Returned by `GET /claim-cases/{axaptaRef}/protocol` with
        `Accept: application/json`. Our Platform uses `protocol_url` to attach the
        PDF to the supplier e-mail.
      required: [axapta_ref, case_number, protocol_url, generated_at]
      properties:
        axapta_ref:
          type: string
          description: The case the protocol belongs to.
        case_number:
          type: string
          description: Human case number (e.g. `RD00057484`) — also on the PDF.
        protocol_url:
          type: string
          format: uri
          description: |
            Link to the protocol PDF on the shared disk (consistent with other
            documents — only URLs go to/from Axapta). The binary is also obtainable
            directly via `Accept: application/pdf` on the same endpoint.
        generated_at:
          type: string
          format: date-time
          description: When Axapta generated the protocol.

    # ----- Goods receipt reservation -----
    GoodsReceiptReservationCreate:
      type: object
      description: |
        "Receipt with reservation" record — visible damage captured on hand-over
        from the carrier, before individual items are processed.
      required: [ms_number, photo_links]
      properties:
        ms_number:
          type: string
          description: |
            MS number = delivery / delivery-note identifier, read by OCR from the MS
            label. Correlates with `delivery_note_number` on the claim case.
          example: "MS-2026-004812"
        photo_links:
          type: array
          minItems: 1
          items: {type: string, format: uri}
          description: |
            Links to photos of the visible damage (packaging, box, pallet, possibly
            goods) stored on the shared disk. Only URLs go to Axapta.
        notes:
          type: string
          description: Optional note from the intake worker.

    GoodsReceiptReservation:
      type: object
      required: [reservation_ref, ms_number, created_at]
      properties:
        reservation_ref:
          type: string
          description: |
            Axapta's internal handle for this reservation record — any unique handle
            (e.g. a row PK) Axapta chooses. The Platform does not parse it and
            **never sends it back** — linking is done by Axapta on `supplier_id` +
            `delivery_note_number`, not by this handle.
        ms_number:
          type: string
          description: |
            Explicitly **non-unique** — one delivery note = one MS = N reservations.
            One goods receipt (one MS number) may carry several reservations.
        supplier:
          anyOf:
            - {$ref: '#/components/schemas/Supplier'}
            - {type: "null"}
          description: |
            Supplier of the delivery, resolved by Axapta from the MS number
            (MS → delivery note → supplier). Lets the Platform address the nightly
            avízo (advance-damage notice) to the supplier without a second lookup.
            `null` only if Axapta cannot resolve it yet.
        photo_links:
          type: array
          items: {type: string, format: uri}
        claim_case_ref:
          type: [string, "null"]
          description: |
            Filled by Axapta once linked to a claim — by matching `supplier_id` +
            `delivery_note_number` (= `ms_number`), in either direction. The value =
            `axapta_ref` of the linked case. Until an SP label / case arises it
            stays `null`.
        created_at: {type: string, format: date-time}

    # =========================================================================
    # Transport invoicing (Fakturace doprav) — Fáze 1
    # =========================================================================
    TransportDocumentType:
      type: string
      description: |
        Document types that make up one route ("trasa"). Czech acronyms kept as
        they are printed on the documents.
        - `ZOPV` — Záznam o provozu vozidla (vehicle operation record); stamps not
          checked; carries actual driver / SPZ / date / distance.
        - `DELIVERY_LIST` — rozvozový list; one per route; N stamps (one per
          pharmacy section).
        - `NIGHT_DELIVERY_CONFIRMATION` — potvrzení o nočním závozu; 0..N; 1 stamp.
        - `NARCOTICS_RECEIPT_CONFIRMATION` — potvrzení o převzetí léčiv s omamnými
          látkami; 0..N; 1 stamp.
        - `POPLSOL` — hromadné potvrzení zásilek s LP s NL; one per route; 1 stamp.
        - `TEMPERATURE_LOG` — záznam teplotního řetězce; 0..N; stamps not checked.
      enum:
        - ZOPV
        - DELIVERY_LIST
        - NIGHT_DELIVERY_CONFIRMATION
        - NARCOTICS_RECEIPT_CONFIRMATION
        - POPLSOL
        - TEMPERATURE_LOG

    TransportRouteStatus:
      type: string
      description: |
        Route billing-readiness state. The `MANUAL_REVIEW → READY_FOR_BILLING`
        override is performed by the transport worker in Axapta, not via the API.
      enum:
        - OPEN              # instance exists, waiting for documents
        - MANUAL_REVIEW     # something doesn't match (missing doc, stamps, km out of tolerance)
        - READY_FOR_BILLING # complete, ready to bill
        - BILLED            # billed

    Carrier:
      type: object
      description: |
        Transport carrier of the route, provided by Axapta (DHL / Cedex / own / …).
        Open-ended, so an object rather than an enum.
      required: [code]
      properties:
        code:
          type: string
          description: Carrier code, e.g. `DHL`, `CEDEX`, `OWN`.
          example: "DHL"
        name:
          type: [string, "null"]
          example: "DHL Supply Chain"
        primary_contact:
          anyOf:
            - {$ref: '#/components/schemas/Contact'}
            - {type: "null"}
          description: |
            Carrier contact the Platform sends route e-mails to (receipt confirmation,
            second avízo). Same shape as `Supplier.primary_contact`; `email` is the
            field the Platform actually needs. `null` if Axapta has no contact on file
            — the Platform then cannot send and reports it as undeliverable.

    Warehouse:
      type: object
      description: |
        The route's home warehouse — the distribution centre the route departs from
        and returns to (`PAVLOV` / `BRNO` / `OSTRAVA` / …). Provided by Axapta;
        open-ended, so an object rather than an enum (same shape as `Carrier`).

        The Platform needs it to detect **edge case A5 — documents handed in at the
        wrong warehouse**: the billing kiosk knows which warehouse it stands in, and
        compares it against this field. A mismatch means the route's documents must
        not be accepted as verified at this kiosk.

        Warehouse coordinates for Fáze 2 geofencing are held on the Platform side and
        keyed by `code`; Axapta does not send them.
      required: [code]
      properties:
        code:
          type: string
          description: Warehouse code, e.g. `PAVLOV`, `BRNO`, `OSTRAVA`.
          example: "PAVLOV"
        name:
          type: [string, "null"]
          example: "DC Pavlov"

    ExpectedTransportDocument:
      type: object
      description: |
        One document Axapta expects for the route, with the stamp count it expects.
      required: [type, expected_count]
      properties:
        type: {$ref: '#/components/schemas/TransportDocumentType'}
        expected_count:
          type: integer
          minimum: 0
          description: How many of this document type the route should have (1, or 0..N).
        expected_stamps:
          type: [integer, "null"]
          minimum: 0
          description: |
            Expected stamp count per document, derived by Axapta from the issued
            document — e.g. the delivery list = number of pharmacy sections.
            `null` where stamps are not checked (e.g. `ZOPV`).

    ZopvData:
      type: object
      description: |
        Fields parsed from the ZOPV (vehicle operation record). Present only on a
        submitted document of type `ZOPV`. The Platform passes the km values
        (`distance_km` declared on the document, `gps_distance_km` measured); every
        check on them runs in Axapta.
      properties:
        actual_driver:
          type: [string, "null"]
          description: Actual driver read from the ZOPV (Axapta's planned driver may differ).
        actual_spz:
          type: [string, "null"]
          description: Actual vehicle plate (SPZ) read from the ZOPV.
        actual_date:
          type: [string, "null"]
          format: date
        distance_km:
          type: [number, "null"]
          minimum: 0
          description: Actually-driven km **declared on the ZOPV** by the driver.
        gps_distance_km:
          type: [number, "null"]
          minimum: 0
          description: |
            Km **measured by GPS Dozor** for the same route, sent alongside the declared
            `distance_km`.

    SubmittedTransportDocument:
      type: object
      description: |
        One recognized document the Platform writes back to the route. Documents are
        versioned — a newer version never overwrites an older one; Axapta keeps all.
      required: [type, storage_link]
      properties:
        type: {$ref: '#/components/schemas/TransportDocumentType'}
        storage_link:
          type: string
          format: uri
          description: |
            Link to the (possibly multi-page) document on the shared disk. Only the
            URL goes to Axapta, not the binary.
        recognized_stamps:
          type: [integer, "null"]
          minimum: 0
          description: |
            Stamp count recognized on the document. `null` where stamps are not
            checked (e.g. `ZOPV`).
        version:
          type: integer
          minimum: 1
          default: 1
          description: |
            Document version. A changed re-scan is submitted as a higher version;
            the older version is retained.
        page_count:
          type: [integer, "null"]
          minimum: 1
          description: Number of pages merged into this document (optional).
        note:
          type: [string, "null"]
          description: |
            Optional note the driver attaches to **this document** at the kiosk
            (e.g. "last page lost", "stamp missing, pharmacy closed").
        zopv:
          anyOf:
            - {$ref: '#/components/schemas/ZopvData'}
            - {type: "null"}
          description: Parsed ZOPV fields — present only for `type = ZOPV`.

    TransportRouteSubmissionCreate:
      type: object
      description: |
        The verification result the Platform writes to a route after recognizing and
        pairing its scanned documents. Upsert against an existing route.
      required: [documents, status]
      properties:
        documents:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/SubmittedTransportDocument'}
        status:
          type: string
          description: |
            The Platform's verdict from documents + stamps. Only these two values may
            be submitted (subset of `TransportRouteStatus`); Axapta may still move the
            route to `MANUAL_REVIEW` from its own km check.
          enum: [READY_FOR_BILLING, MANUAL_REVIEW]
        status_reason:
          type: [string, "null"]
          description: |
            Why the route needs manual review. **Required when `status =
            MANUAL_REVIEW`** (e.g. missing document, stamp mismatch).
        note:
          type: [string, "null"]
          description: |
            Optional **route-wide** note, propagated into Axapta. 

    TransportRoute:
      type: object
      description: |
        A route instance as Axapta knows it — planned data, expected documents, and
        the current verification state. Returned by the read and submit endpoints.
      required: [ar, date, status]
      properties:
        ar:
          type: string
          description: Route identifier = AR document number (barcode on every document).
          example: "AR1548240"
        date: {type: string, format: date}
        status: {$ref: '#/components/schemas/TransportRouteStatus'}
        carrier:
          anyOf:
            - {$ref: '#/components/schemas/Carrier'}
            - {type: "null"}
        warehouse:
          anyOf:
            - {$ref: '#/components/schemas/Warehouse'}
            - {type: "null"}
          description: |
            Home warehouse of the route. The kiosk compares it against the warehouse
            it stands in to catch edge case (documents handed in at the wrong
            warehouse). `null` only if Axapta cannot resolve it.
        planned_driver: {type: [string, "null"]}
        planned_spz: {type: [string, "null"]}
        planned_departure:
          type: [string, "null"]
          format: date-time
          description: |
            Planned departure for expedition. It bounds the GPS Dozor query window for the vehicle
            (± a platform-side buffer).
          example: "2026-05-17T04:30:00Z"
        planned_return:
          type: [string, "null"]
          format: date-time
          description: |
            Planned return to the home warehouse, or planned arrival at the last pharmacy
            for a route that does not return.
          example: "2026-05-17T15:00:00Z"
        expected_km:
          type: [number, "null"]
          minimum: 0
          description: Expected km for the route (planned).
        km_tolerance:
          type: [number, "null"]
          minimum: 0
          description: Allowed km deviation; the km check runs in Axapta.
        expected_documents:
          type: array
          items: {$ref: '#/components/schemas/ExpectedTransportDocument'}
        submitted_documents:
          type: array
          description: Documents already written back to the route (echo, latest versions).
          items: {$ref: '#/components/schemas/SubmittedTransportDocument'}
        updated_at: {type: [string, "null"], format: date-time}

    TransportRouteList:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/TransportRoute'}
        page: {$ref: '#/components/schemas/PageInfo'}
